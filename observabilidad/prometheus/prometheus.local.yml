# Variante para probar el dashboard contra el backend de tu maquina, sin depender de que
# produccion tenga el token puesto. Misma forma que prometheus.yml, otro objetivo.
global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: peluqueria-prod
    # El job se llama igual que en produccion a proposito: asi el panel "Backend", que
    # consulta up{job="peluqueria-prod"}, funciona en los dos montajes sin tocar el dashboard.
    scheme: http
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          entorno: local
    http_headers:
      X-Metrics-Token:
        files:
          - /etc/prometheus/token
