spring.application.name=peluqueria

# perfil activo por defecto (cambiar a "prod" en produccion)
spring.profiles.active=dev

# configuracion comun
# Cloud Run inyecta el puerto via la env var PORT; en local cae al 8080.
server.port=${PORT:8080}

# conexion a postgresql
# DB_URL se externaliza para produccion (Supabase via session pooler, con ?sslmode=require).
# En local
# (sin la variable) cae a la BD de desarrollo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/peluqueria_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT
jwt.secret=${JWT_SECRET}
# Access token de vida corta (30 min, en milisegundos). El cliente lo renueva con el refresh
# token (ver mas abajo) sin re-login. Ventana corta para acotar el riesgo si se roba el access.
jwt.expiration=${JWT_EXPIRATION:1800000}

# === Refresh tokens ===
# Dias de validez del refresh token. Rota en cada uso (deteccion de reuso por familia) y se
# invalida al cambiar password/rol (via tokenVersion). Permite no re-loguear durante este plazo.
peluqueria.refresh.expiracion-dias=${REFRESH_EXPIRACION_DIAS:30}

# Origenes permitidos para CORS (frontend admin en desarrollo)
cors.allowed-origins=http://localhost:4200

# Horario laboral de la peluqueria (L-S). Domingo cerrado.
peluqueria.horario.apertura=09:00
peluqueria.horario.cierre=20:00
# Dias de la semana en los que no se abre nunca (lista separada por comas: SUNDAY,SATURDAY).
# Los festivos y cierres puntuales NO van aqui: se gestionan desde el panel admin
# (tabla dias_bloqueados / endpoint /api/dias-bloqueados).
peluqueria.horario.dias-cerrados=SUNDAY

# === Recordatorio de citas ===
# Antelacion con la que se envia el recordatorio (24h por defecto).
peluqueria.recordatorio.horas-antes=${RECORDATORIO_HORAS_ANTES:24}

# === Email / SMTP (notificaciones) ===
# Credenciales por env var (NUNCA hardcodear). En local, Gmail sirve (puerto 587 + App Password:
# MAIL_USERNAME = cuenta gmail, MAIL_PASSWORD = App Password de la verificacion en 2 pasos).
# En produccion sobre Render Free los puertos SMTP 25/465/587 estan bloqueados de salida, asi
# que se usa un proveedor transaccional (p. ej. Brevo) por su relay en el puerto 2525:
# MAIL_HOST=smtp-relay.brevo.com, MAIL_PORT=2525, MAIL_USERNAME/MAIL_PASSWORD = login + SMTP key.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remitente de los correos. Debe ser un remitente verificado en el proveedor: con Gmail debe
# coincidir con MAIL_USERNAME; con Brevo, un sender validado en el panel.
peluqueria.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@lalosegovia.com}}
# Direccion del negocio que recibe los avisos de citas (reservada/modificada/anulada).
peluqueria.mail.negocio=${BUSINESS_EMAIL:edu92seg@gmail.com}
# Habilita/inhabilita el envio real (util para dev sin credenciales SMTP).
peluqueria.mail.enabled=${MAIL_ENABLED:true}
# URL base del frontend para enlaces en correos (ej. reset de password).
peluqueria.frontend-url=${FRONTEND_URL:http://localhost:4200}

# === Stripe (pagos online) ===
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# === Recuperacion de contrasena ===
# Minutos de validez del enlace de restablecimiento (token de un solo uso).
peluqueria.reset.expiracion-minutos=${RESET_EXPIRACION_MINUTOS:30}

# Almacen de ficheros. Sin estas dos variables se usa el disco local (solo desarrollo:
# el disco del contenedor de produccion es efimero). La service key salta las politicas
# de Supabase, asi que vive solo aqui y nunca en los frontends.
peluqueria.almacen.supabase-url=${SUPABASE_URL:}
peluqueria.almacen.service-key=${SUPABASE_SERVICE_KEY:}
peluqueria.almacen.bucket-servicios=${SUPABASE_BUCKET_SERVICIOS:servicios}
peluqueria.almacen.tamano-maximo=2MB
peluqueria.almacen.base-url-local=${ALMACEN_BASE_URL_LOCAL:http://localhost:8080}

# Tope de la propia peticion: corta la subida antes de que el fichero llegue a
# memoria, que con 512 MB de RAM en produccion no es un detalle. El margen sobre
# tamano-maximo cubre la sobrecarga del multipart.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Rate limiting (por IP) de los endpoints publicos /api/auth/recuperar y /api/auth/reset:
# como maximo {capacidad} peticiones por cada ventana de {ventana-minutos}.
peluqueria.ratelimit.reset.capacidad=${RATELIMIT_RESET_CAPACIDAD:5}
peluqueria.ratelimit.reset.ventana-minutos=${RATELIMIT_RESET_VENTANA_MINUTOS:15}
