spring.application.name=peluqueria

# perfil activo por defecto (cambiar a "prod" en produccion)
spring.profiles.active=dev

# configuracion comun
# Cloud Run inyecta el puerto via la env var PORT; en local cae al 8080.
server.port=${PORT:8080}

# conexion a postgresql
# DB_URL se externaliza para produccion (Supabase via session pooler, con ?sslmode=require).
# En local
# (sin la variable) cae a la BD de desarrollo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/peluqueria_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT
jwt.secret=${JWT_SECRET}
# Access token de vida corta (30 min, en milisegundos). El cliente lo renueva con el refresh
# token (ver mas abajo) sin re-login. Ventana corta para acotar el riesgo si se roba el access.
jwt.expiration=${JWT_EXPIRATION:1800000}

# === Refresh tokens ===
# Dias de validez del refresh token. Rota en cada uso (deteccion de reuso por familia) y se
# invalida al cambiar password/rol (via tokenVersion). Permite no re-loguear durante este plazo.
peluqueria.refresh.expiracion-dias=${REFRESH_EXPIRACION_DIAS:30}

# Origenes permitidos para CORS (frontend admin en desarrollo)
cors.allowed-origins=http://localhost:4200

# Horario laboral de la peluqueria (L-S). Domingo cerrado.
peluqueria.horario.apertura=09:00
peluqueria.horario.cierre=20:00
# Dias de la semana en los que no se abre nunca (lista separada por comas: SUNDAY,SATURDAY).
# Los festivos y cierres puntuales NO van aqui: se gestionan desde el panel admin
# (tabla dias_bloqueados / endpoint /api/dias-bloqueados).
peluqueria.horario.dias-cerrados=SUNDAY

# === Recordatorio de citas ===
# Antelacion con la que se envia el recordatorio (24h por defecto).
peluqueria.recordatorio.horas-antes=${RECORDATORIO_HORAS_ANTES:24}

# === Email / SMTP (notificaciones) ===
# Credenciales por env var (NUNCA hardcodear). En local, Gmail sirve (puerto 587 + App Password:
# MAIL_USERNAME = cuenta gmail, MAIL_PASSWORD = App Password de la verificacion en 2 pasos).
# En produccion sobre Render Free los puertos SMTP 25/465/587 estan bloqueados de salida, asi
# que se usa un proveedor transaccional (p. ej. Brevo) por su relay en el puerto 2525:
# MAIL_HOST=smtp-relay.brevo.com, MAIL_PORT=2525, MAIL_USERNAME/MAIL_PASSWORD = login + SMTP key.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remitente de los correos. Debe ser un remitente verificado en el proveedor: con Gmail debe
# coincidir con MAIL_USERNAME; con Brevo, un sender validado en el panel.
peluqueria.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@lalosegovia.com}}
# Direccion del negocio que recibe los avisos de citas (reservada/modificada/anulada).
peluqueria.mail.negocio=${BUSINESS_EMAIL:edu92seg@gmail.com}
# Habilita/inhabilita el envio real (util para dev sin credenciales SMTP).
peluqueria.mail.enabled=${MAIL_ENABLED:true}
# URL base del frontend para enlaces en correos (ej. reset de password).
peluqueria.frontend-url=${FRONTEND_URL:http://localhost:4200}

# === Stripe (pagos online) ===
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# === Recuperacion de contrasena ===
# Minutos de validez del enlace de restablecimiento (token de un solo uso).
peluqueria.reset.expiracion-minutos=${RESET_EXPIRACION_MINUTOS:30}

# Almacen de ficheros. Sin estas dos variables se usa el disco local (solo desarrollo:
# el disco del contenedor de produccion es efimero). La service key salta las politicas
# de Supabase, asi que vive solo aqui y nunca en los frontends.
peluqueria.almacen.supabase-url=${SUPABASE_URL:}
peluqueria.almacen.service-key=${SUPABASE_SERVICE_KEY:}
peluqueria.almacen.bucket-servicios=${SUPABASE_BUCKET_SERVICIOS:servicios}
# El bucket de avatares NO es publico (el avatar es un dato personal): se lee con
# URL firmada, que caduca en validez-url-firmada.
peluqueria.almacen.bucket-avatares=${SUPABASE_BUCKET_AVATARES:avatares}
# La galeria de trabajos es material promocional: bucket publico, como el catalogo.
peluqueria.almacen.bucket-galeria=${SUPABASE_BUCKET_GALERIA:galeria}
peluqueria.almacen.validez-url-firmada=${ALMACEN_VALIDEZ_URL_FIRMADA:1h}
peluqueria.almacen.tamano-maximo=2MB
peluqueria.almacen.base-url-local=${ALMACEN_BASE_URL_LOCAL:http://localhost:8080}

# Tope de la propia peticion: corta la subida antes de que el fichero llegue a
# memoria, que con 512 MB de RAM en produccion no es un detalle. El margen sobre
# tamano-maximo cubre la sobrecarga del multipart.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# === Asistente conversacional (Gemini) ===
# Interruptor del asistente, y el unico que hay que tocar para encenderlo o apagarlo:
#   none         -> apagado (por defecto). Spring AI no autoconfigura ningun modelo y el
#                   dominio asistente/ no se registra. La aplicacion arranca igual y el
#                   resto del API no se entera: el asistente es un extra, no una dependencia.
#   google-genai -> encendido con Gemini. Requiere GEMINI_API_KEY.
# Es deliberado que por defecto este apagado: la autoconfiguracion de Spring AI solo mira
# si la clase esta en el classpath, no si hay API key, asi que sin este 'none' la
# aplicacion NO ARRANCA en cualquier entorno sin key (los tests de integracion incluidos).
# El valor es el nombre del proveedor en Spring AI, asi que cambiar de proveedor (por
# ejemplo a 'openai' apuntando a Groq) es cambiar esto y la dependencia, no el codigo.
spring.ai.model.chat=${ASISTENTE_MODELO:none}

# API key de Google AI Studio (https://aistudio.google.com/apikey), que es el modo con
# tier gratuito. NO poner project-id/location: eso conmuta el starter a modo Vertex AI,
# que es de pago.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
# Flash es la gama con tier gratuito util: Pro esta limitado a 50 peticiones/dia y no sirve
# aqui. Los limites de cada modelo solo son fiables en https://aistudio.google.com/rate-limit.
# Ojo con los ids retirados, porque el sintoma no es obvio: gemini-2.5-flash responde 404
# "no longer available to new users" a una key nueva, aunque la pagina de deprecaciones de
# Google lo siga dando por activo y sin fecha de cierre. Fue lo que tumbo al asistente en
# produccion el 2026-08-25, y Google indica gemini-3.6-flash como reemplazo en el propio 404.
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.6-flash}
# Tope de la respuesta, no una reserva: solo se paga lo que el modelo genera de verdad, asi
# que un tope holgado no gasta cuota en las respuestas de dos o tres frases de siempre. Estuvo
# en 512 y era arriesgado: los modelos 3.x razonan por defecto y esos tokens cuentan contra
# este tope, asi que el presupuesto se puede agotar pensando y devolver una respuesta vacia
# (que aqui acaba en 503 por la rama de "el modelo no devolvio ninguna respuesta").
spring.ai.google.genai.chat.options.max-output-tokens=${GEMINI_MAX_TOKENS:2048}

# Cupo del asistente por IP. Es el freno real del gasto: el endpoint es publico y cada
# peticion consume cuota. 10 por hora da de sobra para una consulta de verdad y no
# alcanza para agotar el dia.
peluqueria.ratelimit.asistente.capacidad=${ASISTENTE_RATELIMIT_CAPACIDAD:10}
peluqueria.ratelimit.asistente.ventana-minutos=${ASISTENTE_RATELIMIT_VENTANA:60}
# Rate limiting (por IP) de los endpoints publicos /api/auth/recuperar y /api/auth/reset:
# como maximo {capacidad} peticiones por cada ventana de {ventana-minutos}.
peluqueria.ratelimit.reset.capacidad=${RATELIMIT_RESET_CAPACIDAD:5}
peluqueria.ratelimit.reset.ventana-minutos=${RATELIMIT_RESET_VENTANA_MINUTOS:15}

# === Observabilidad (Actuator + Prometheus) ===
# Lista blanca de endpoints, y es lo unico que hay que revisar aqui: Actuator trae docenas,
# y env/beans/configprops filtrarian la configuracion entera con credenciales incluidas. Se
# exponen solo estos dos. SecurityConfig ademas los tapa con un denyAll, para que exponer
# uno por error aqui no lo publique de verdad: dos barreras, no una.
management.endpoints.web.exposure.include=health,prometheus
# health es publico (lo consulta el health check de Render), asi que no dice nada mas que si
# la aplicacion vive: sin detalles ni componentes no revela que la BD es Postgres, ni el
# estado del disco, ni que servicios externos hay cableados.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Token que exige /actuator/prometheus en la cabecera X-Metrics-Token. Sin el, el endpoint
# queda cerrado: el olvido cierra las metricas en vez de publicarlas (ver
# MetricasTokenAuthorizationManager).
peluqueria.metricas.token=${METRICAS_TOKEN:}
# El indicador de correo NO cuenta para el health. Es la linea mas importante de este bloque:
# Actuator lo activa solo por tener el starter de mail, intenta conectar con Gmail, y si falla
# pone el health global en DOWN -> 503. El health check de Render lee justo ese endpoint, asi
# que un hipo del SMTP daria el backend por caido y lo reiniciaria en bucle con las citas y los
# pagos funcionando perfectamente. El correo es asincrono y opcional (peluqueria.mail.enabled):
# que no salga un email no impide servir el API, luego no puede tumbar el servicio.
# La BD si se deja: sin ella la aplicacion no puede atender nada y reiniciar es lo correcto.
management.health.mail.enabled=false
# Etiqueta comun a todas las metricas, para que un dashboard pueda filtrar por aplicacion
# si algun dia hay mas de una en el mismo Prometheus.
management.metrics.tags.application=peluqueria
# Histograma de la latencia HTTP. Sin esto Micrometer solo publica media y maximo, y la
# media de una latencia no dice nada: lo que interesa es el percentil 95, que es lo que nota
# el usuario que peor lo pasa. Tiene que ser esta property, con el nombre de la metrica al
# final: la variante management.metrics.web.server.request.autotime.percentiles-histogram
# existe, se acepta sin protestar y NO publica los buckets, asi que los paneles de
# percentiles salen vacios sin que nada de error. Comprobado a mano contra el endpoint.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
